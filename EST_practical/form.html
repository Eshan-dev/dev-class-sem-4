<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <div id ="container">

        <form id="form-container">
            <input  class="form-element text-input" type="text" placeholder="Name" id="name"></input>
            <br>
            <input  class="form-element text-input" type="text" placeholder="Email" id ="email"></input>
            <br>
            <input  class="form-element text-input" type="text" placeholder="Password" id = "password"></input>
            <br>
            <input  class="form-element text-input" type="text" placeholder="Mobile Number"id="mobilenumber"></input>
            <br>
            <textarea  class="form-element text-input" placeholder="Address" id="address"></textarea>
            <br>
            <div id = "gender-container" class="form-element">

                <span>Gender</span>
                <input type="radio" value="gender" name="gender">Male</input> 
                <input type="radio" value="gender" name="gender">Female</input> 
            </div>
            <div id="course-container" class="form-element">
                <span>Select Course</span>
                <select>
                    <option>DBMS</option>
                    <option>Full Stack</option>
                    <option>CP</option>
                </select>
            </div>
            <br>
            <button class="form-element submit-button" >Submit</button>
            <!-- <input type="radio">
            <input type="radio">Male</input>
            <input type="radio">Female</input>
            <input> -->
        </form>
    </div>
</body>
</html>
