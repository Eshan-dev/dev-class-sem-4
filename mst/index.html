<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
</head>
<body>
    <!-- Task Input Section -->
    <h1>Student Task Manager</h1>

    <form id="task-form">
        <div>
            <label for="task-name">Task Name:</label>
            <input type="text" id="task-name" name="task-name" />
        </div>

        <div>
            <label for="priority">Priority:</label>
            <select id="priority" name="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
        </div>

        <button type="submit" id="add-task-btn">Add Task</button>
    </form>

    <!-- Filter Section -->
    <h2>Filter</h2>
    <button type="button" class="filter-btn" data-filter="all">Show All</button>
    <button type="button" class="filter-btn" data-filter="completed">Completed</button>
    <button type="button" class="filter-btn" data-filter="active">Pending</button>

    <!-- Task List -->
    <h2>Tasks</h2>
    <ul id="task-list">
        <!-- Tasks will be added here by JavaScript -->
    </ul>

    <script src="app.js"></script>
</body>
</html>
