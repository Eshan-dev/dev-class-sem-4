<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Job Portal</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-form">
            <input type="text" placeholder="Company Name" id='companyInput'>
            <input type="text" placeholder="Salary" id='salaryInput'>
            <input type="text" placeholder="Location" id='locationInput'>
            <input type="text" placeholder="Image URL" id='imageInput'>
            
            <button id="add-job-button" onclick="addJob()">Add Job</button>
            <button class="admin-clear-btn" onclick="clearForm()">Clear</button>
        </div>
        <div id="jobs-container"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
