<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="navContainer">
        <div id = "navBar">
            <div id="leftComp">
                <img src="https://static.naukimg.com/s/0/0/i/naukri-identity/naukri_gnb_logo.svg">
                <div id = "leftComp-sub">
                    <a class="leftComp-sub-ele">Jobs</a>
                    <a class="leftComp-sub-ele">Companies</a>
                </div>
            </div>
            <div id = "rightComp">
                <div id="btnContainer">
                    <button id = "loginBtn">Login</button>
                    <button id="registerBtn">Register</button>
                </div>
            </div>
        </div>
    </nav>
    <section id ="mainContainer">
        <div id = "search-container">

            <div>
                <h1>Find your dream job now</h1>
            </div>
            <div>
                <input id = "inputBox" placeholder="Search Companies">
                <button>Search</button>
            </div>
        </div>
        <div id="jobs-container">
            <!-- Jobs will be loaded here from localStorage -->
        </div>
    </section>

    <script>
        window.addEventListener('load', function () {
            const jobs = JSON.parse(localStorage.getItem('jobs')) || [];
            const jobContainer = document.getElementById('jobs-container');
            jobContainer.innerHTML = '';

            jobs.forEach(function (job) {
                const jobCard = document.createElement('div');
                jobCard.className = 'job';

                const img = document.createElement('img');
                img.className = 'job-image-container';
                img.src = 'https://53.fs1.hubspotusercontent-na1.net/hubfs/53/image8-2.jpg'; // Google image for now

                const descContainer = document.createElement('div');
                descContainer.className = 'job-description-container';

                const companyName = document.createElement('div');
                companyName.className = 'company-name';
                companyName.textContent = job.company;

                const jobInfo = document.createElement('div');
                jobInfo.className = 'job-info';

                const salaryInfo = document.createElement('div');
                salaryInfo.className = 'salary-info';
                salaryInfo.textContent = job.salary;

                const locationInfo = document.createElement('div');
                locationInfo.className = 'location-info';
                locationInfo.textContent = job.location;

                jobInfo.appendChild(salaryInfo);
                jobInfo.appendChild(locationInfo);

                descContainer.appendChild(companyName);
                descContainer.appendChild(jobInfo);

                jobCard.appendChild(img);
                jobCard.appendChild(descContainer);

                jobContainer.appendChild(jobCard);
            });
        });
    </script>
</body>
</html>
